name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Production dependencies only. The dev tree carries advisories in build tooling
      # (a bundler's id generator, a config parser) that never reach a user's machine, and
      # failing the build on those trains people to ignore this step.
      # The registry is pinned because .npmrc points at a mirror with no advisory endpoint.
      - name: Audit production dependencies
        run: pnpm audit --prod --registry=https://registry.npmjs.org/

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # What is ignored, and why each one cannot be fixed, is in
      # apps/desktop/src-tauri/.cargo/audit.toml — next to the code rather than buried in CI.
      - name: Cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit
