name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the tree (typecheck, lint, test, audit). CI is also the one
# workflow that runs code from a fork's pull request, so the token it hands that code
# must not be able to write anything. A step that needs more (commenting on a PR, say)
# gets it on that job, not here.
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Production dependencies only. The dev tree carries advisories in build tooling
      # (a bundler's id generator, a config parser) that never reach a user's machine, and
      # failing the build on those trains people to ignore this step.
      # There is no .npmrc in this repo; the registry is named explicitly so that running this
      # command on a dev machine whose global npm config points at a mirror gives the same
      # answer as CI does.
      # A real advisory fails the build; the advisory service being unreachable does not.
      # On 2026-09-03 npm's bulk endpoint timed out on the runner and turned a green tree red,
      # which teaches people to ignore a red build rather than to read it.
      - name: Audit production dependencies
        run: |
          set +e
          output=$(pnpm audit --prod --registry=https://registry.npmjs.org/ 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && printf '%s' "$output" | grep -qE "TimeoutError|ENDPOINT_NOT_EXISTS|ECONNRESET|ETIMEDOUT|EAI_AGAIN|error \(23\)"; then
            echo "::warning::npm advisory service unreachable — dependency audit skipped this run"
            exit 0
          fi
          exit $status

  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # What is ignored, and why each one cannot be fixed, is in
      # apps/desktop/src-tauri/.cargo/audit.toml — next to the code rather than buried in CI.
      - name: Cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit
