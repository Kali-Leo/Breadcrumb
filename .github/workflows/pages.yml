name: Browser edition

# Publishes apps/web to GitHub Pages, so the app can be used by opening a URL with nothing
# to install. The desktop build is unaffected; this is a second way to run the same code.
on:
  push:
    branches: [main]
    paths:
      # The browser edition builds apps/desktop's source, so a change there changes it too.
      - "apps/web/**"
      - "apps/desktop/src/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one thing that could break silently: the whole schema runs on a different SQLite
      # build here. Failing the deploy is better than shipping a page that loses data.
      - name: Verify the schema on SQLite-wasm
        run: pnpm --filter @breadcrumb/web test

      - name: Build
        run: pnpm --filter @breadcrumb/web build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
