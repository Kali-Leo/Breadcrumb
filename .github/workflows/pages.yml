name: Browser edition

# Publishes apps/web to GitHub Pages, so the app can be used by opening a URL with nothing
# to install. The desktop build is unaffected; this is a second way to run the same code.
on:
  push:
    branches: [main]
    paths:
      # The browser edition builds apps/desktop's source, so a change there changes it too.
      - "apps/web/**"
      - "apps/desktop/src/**"
      - "packages/**"
      # Not under apps/desktop/src: the shared chunking rules, and the file behind the
      # 2026-09-02 offline white screen. Fixing it alone used to deploy nothing.
      - "apps/desktop/vite.chunks.ts"
      # The build's own guards run from here — check-bundle-size.mjs decides whether a bundle
      # ships at all, so a change to it can change what this workflow accepts.
      - "scripts/**"
      # Installs are --frozen-lockfile, so this file is what decides which dependency versions
      # end up in the bundle; an upgrade with no source change still ships different code.
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type errors used to travel all the way into production: nothing here ran tsc, and the
      # build does not type-check. This is the cheapest gate there is.
      - name: Type-check
        run: pnpm --filter @breadcrumb/web typecheck

      # The one thing that could break silently: the whole schema runs on a different SQLite
      # build here. Failing the deploy is better than shipping a page that loses data.
      - name: Verify the schema on SQLite-wasm
        run: pnpm --filter @breadcrumb/web test

      - name: Build
        run: pnpm --filter @breadcrumb/web build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
