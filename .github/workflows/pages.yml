name: Browser edition

# Publishes apps/web to GitHub Pages, so the app can be used by opening a URL with nothing
# to install. The desktop build is unaffected; this is a second way to run the same code.
on:
  push:
    branches: [main]
    paths:
      # The browser edition builds apps/desktop's source, so a change there changes it too.
      - "apps/web/**"
      - "apps/desktop/src/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type errors used to travel all the way into production: nothing here ran tsc, and the
      # build does not type-check. This is the cheapest gate there is.
      - name: Type-check
        run: pnpm --filter @breadcrumb/web typecheck

      # The one thing that could break silently: the whole schema runs on a different SQLite
      # build here. Failing the deploy is better than shipping a page that loses data.
      - name: Verify the schema on SQLite-wasm
        run: pnpm --filter @breadcrumb/web test

      - name: Build
        run: pnpm --filter @breadcrumb/web build

      # Language packs, served from this site rather than from GitHub Releases. Release assets
      # send no CORS headers on either hop of their redirect, so a page can never fetch one —
      # measured 2026-09-02, and it left all eight downloadable pairs uninstallable here.
      # The files are byte-for-byte the release assets; installLanguagePack still checks each
      # one against the digest baked into the catalogue before it is stored.
      - name: Bundle the language packs into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/src/assets/language-packs/catalog.json').packs[0].version")
          mkdir -p apps/web/dist/language-packs
          gh release download "language-packs-$version" \
            --repo "$GITHUB_REPOSITORY" \
            --dir apps/web/dist/language-packs \
            --pattern '*.json'
          ls -l apps/web/dist/language-packs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
