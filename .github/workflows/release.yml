name: Release

# Tag-driven. Push a tag like v0.1.0 and this builds installers for every desktop
# platform we support and attaches them to a GitHub release.
#
# macOS is deliberately absent: shipping a Mac build that is not notarised gives users a
# "damaged app" dialog they cannot get past, and notarisation needs an Apple developer
# account. Better to ship nothing there than something broken.
on:
  push:
    tags:
      - "v*"
  # Lets a build be rehearsed against main before a tag is cut.
  workflow_dispatch:

# Read by default. Only the two jobs that publish to the release ask for write, and they
# ask for it on themselves — a compromised build step should not inherit write access
# just because it shares a workflow with one.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    # tauri-action creates the release and attaches the installers to it.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04, reluctantly. 22.04 would produce an AppImage that runs on far more
          # machines, but the prebuilt ONNX Runtime that ort-sys downloads is compiled
          # against glibc 2.38+ and will not link against 22.04's 2.35 (`__isoc23_strtoull`
          # and friends are simply absent). Building ONNX Runtime from source, or switching
          # ort to dynamic loading, would buy back the older distributions — worth doing,
          # but not at the cost of having no Linux build at all.
          - platform: ubuntu-24.04
            label: Linux (deb + AppImage)
            args: ""
          - platform: windows-latest
            label: Windows (installer)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # The Rust side pulls ONNX Runtime through fastembed, so a cold build is long.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Breadcrumb ${{ github.ref_name }}
          releaseBody: |
            Download the file for your system, install it, and open it.

            - **Windows** — the `.exe` installer.
            - **Linux** — `.AppImage` runs without installing (`chmod +x` then double-click);
              the `.deb` is for Debian and Ubuntu. Both need glibc 2.38 or newer
              (Ubuntu 24.04+, Debian 13+, Fedora 39+).

            On first run the app asks for an AI service — any OpenAI-compatible endpoint
            works. Nothing you write leaves your computer except the messages you send to
            that service, and the settings page shows what every feature costs before you
            turn it on.

            **Checking your download.** `SHA256SUMS` is attached to this release: download
            it next to the installer and run `sha256sum --check --ignore-missing SHA256SUMS`
            (on Windows, `certutil -hashfile <filename> SHA256` and compare the line by eye).
            **校验下载。** 本次发布附带 `SHA256SUMS`：把它下载到安装包旁边，运行
            `sha256sum --check --ignore-missing SHA256SUMS`（Windows 用
            `certutil -hashfile <文件名> SHA256`，再与文件里对应那行比对）。
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # Signing the installers needs certificates we do not have. A checksum list published
  # from the same run that produced the files is the part we can do: it lets anyone tell
  # whether the file they downloaded is the file this workflow built.
  checksums:
    name: Publish SHA256SUMS
    needs: build
    # A workflow_dispatch rehearsal builds no release, so there is nothing to hash.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download every asset on the release
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*' --clobber

      - name: Hash them
        run: |
          cd assets
          # A re-run would otherwise hash the previous run's list into the new one.
          rm -f SHA256SUMS
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Attach SHA256SUMS to the release
        run: gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
