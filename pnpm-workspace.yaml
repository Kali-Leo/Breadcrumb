packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # These three only reach the tree as optional dependencies of @huggingface/transformers,
  # which no edition of this app installs — the browser build refuses embeddings outright
  # (apps/web/src/shims/embeddings.ts) and the desktop build does them in Rust. Their
  # postinstall scripts would download native binaries, so: no.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
# Security overrides for transitive packages we cannot upgrade through their parents yet
# (2026-09-03 CI audit). sharp and adm-zip sit on @huggingface/transformers' Node-only
# optional path and are never installed for the browser build; @xmldom/xmldom is pixi.js's.
overrides:
  "@xmldom/xmldom": ">=0.8.15"   # GHSA-6gmq-8vp8-gcm6
  sharp: ">=0.35.0"              # GHSA-f88m-g3jw-g9cj
  adm-zip: ">=0.6.0"             # GHSA-xcpc-8h2w-3j85
# One advisory is acknowledged rather than fixed, because it cannot be fixed today and cannot
# reach anyone. GHSA-vwc7-r8mq-g2x9 is adm-zip <=0.6.0 and names 0.6.1 as the patched release;
# 0.6.0 is the newest version published, so there is nothing to upgrade to. adm-zip reaches the
# tree only under onnxruntime-node, which no edition installs or ships: the browser build runs
# onnxruntime-web and the desktop build embeds in Rust. Nothing in either bundle can call it.
# Drop this the day 0.6.1 exists — `npm view adm-zip versions` is the whole check.
auditConfig:
  ignoreGhsas:
    - GHSA-vwc7-r8mq-g2x9
