[package]
name = "breadcrumb-desktop"
version = "0.1.0"
description = "Breadcrumb: local-first AI learning companion"
authors = ["Breadcrumb contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Same sqlx the sql plugin uses (feature-unified to one build) — needed by the
# execute_sql_transaction command to run a statement batch on one pooled connection.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The collector's pairing code and per-browser keys. std has no random source; this is the
# one the whole Rust ecosystem uses to ask the operating system for bytes.
getrandom = "0.3"
fastembed = "6.0.3"
fsrs = "6.6.1"
# Reading a file the user picked, and the picker that lets them pick it. Both are read-only
# in the capability set (capabilities/default.json says exactly what was granted).
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# fastembed downloads only its own built-in models and neither of ours is one, so the model
# files are fetched here. reqwest is already in the build under tauri-plugin-http, at this
# version with these TLS features — naming it directly makes it usable from our own code
# without adding anything to the dependency graph.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# For the digests those downloads are checked against. Already built for sqlx underneath.
sha2 = "0.10"
# The pause before a model source is asked a second time, and the lock that keeps model
# downloads to one at a time (both model_sources.rs). Tauri's own runtime is this tokio;
# naming it adds two features to a crate already in the build.
tokio = { version = "1", features = ["time", "sync"] }
# Reading scanned pages: PaddleOCR's PP-OCRv6 graphs through the same onnxruntime fastembed
# links (both pin ort 2.0.0-rc.13, so one runtime is built, not two). The core crate rather
# than `oar-ocr` itself, which would bring a PDF renderer, a font stack and a CLI along.
oar-ocr-core = "0.9.2"
# The page arrives as RGBA bytes and the OCR models take an RgbImage; this is the type both
# oar-ocr and fastembed already build against.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Unix only, and only for getuid(): validated_binary has to know whether the file it is about
# to execute belongs to the user running the app, and std offers no way to ask.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
