# cargo-audit configuration.
#
# The ignore list is not a way to make the check quiet — every entry is here because there is
# no version to move to, and each says why. Anything that CAN be fixed gets fixed instead.

[advisories]
ignore = [
  # The gtk3-rs family was retired upstream. Tauri 2's Linux backend is GTK3 + webkit2gtk, so
  # these arrive with the framework and there is no maintained release to upgrade into. They
  # are "unmaintained" notices, not vulnerabilities.
  "RUSTSEC-2024-0411", # gtk
  "RUSTSEC-2024-0412", # gtk-sys
  "RUSTSEC-2024-0413", # gtk3-macros
  "RUSTSEC-2024-0414", # gdk
  "RUSTSEC-2024-0415", # gdk-sys
  "RUSTSEC-2024-0416", # gdkx11
  "RUSTSEC-2024-0417", # gdkx11-sys
  "RUSTSEC-2024-0418", # gdkwayland-sys
  "RUSTSEC-2024-0419", # atk
  "RUSTSEC-2024-0420", # atk-sys
  "RUSTSEC-2024-0429", # glib — unsound VariantStrIter; needs glib >=0.20, held back by Tauri

  # Build-time proc-macro helpers, pulled transitively. They never run on a user's machine.
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2024-0436", # paste

  # The unic-* crates are unmaintained and reach us through idna_adapter, several layers down
  # in the HTTP stack. Same situation: a notice, with nothing to upgrade to.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[yanked]
# A yanked transitive crate is worth knowing about, but it is not a vulnerability and there is
# nothing actionable when the yank happened upstream of us. Real advisories still fail the run.
enabled = false
